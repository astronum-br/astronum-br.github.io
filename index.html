cidade rara de materializar sonhos. Onde outros veem caos, você vê estrutura. Seu nome carrega a vibração da terra fértil: trabalho constante que ergue templos. Evite a rigidez. Sua missão é provar que o espiritual também precisa de alicerces sólidos para durar.",5:"Seu nome é vento. O 5 é liberdade, movimento, cinco sentidos despertos. Você veio quebrar gaiolas, experimentar, mudar de rota sem medo. Carrega magnetismo, curiosidade e uma alma nômade que aprende através do corpo. O desafio é encontrar liberdade sem fuga. Você ensina ao mundo que evoluir exige coragem de se reinventar.",6:"Você carrega o coração do lar no universo. O 6 é amor responsável, beleza, cuidado e serviço. Sua vibração acolhe, harmoniza ambientes, cura famílias e memórias. Você tem o dom estético de trazer o céu para a casa. O aprendizado é cuidar sem controlar, amar sem se sacrificar. Sua missão é lembrar que amor é lar.",7:"Você é o buscador. O 7 vibra introspecção, mistério, espiritualidade e sede de verdade. Seu nome sussurra segredos antigos — você não se contenta com superfícies. Tem mente analítica e alma mística, ponte entre ciência e oráculo. O desafio é sair da torre e confiar. Você veio para decifrar o invisível e compartilhar a sabedoria encontrada no silêncio.",8:"Seu nome ressoa poder materializado. O 8 é abundância, autoridade, karma e manifestação. Você entende, mesmo sem perceber, as leis do fluxo — dar e receber, semear e colher. Tem potencial para liderar grandes projetos e transformar matéria em significado. O convite é usar o poder com ética. Você veio para mostrar que matéria e espírito podem prosperar juntos.",9:"Você é a despedida e o recomeço. O 9 carrega compaixão universal, arte, finalizações e sabedoria humanitária. Já viveu muitas vidas em uma só, por isso sente a dor do mundo. Seu dom é transmutar, perdoar e inspirar com sua história. Aprenda a deixar ir. Sua missão é fechar ciclos com amor e abrir espaço para uma consciência mais elevada.",11:"Você é um canal. O 11, primeiro número mestre, vibra intuição elevada, inspiração e iluminação. Sua sensibilidade é antena — você capta o que ainda não existe. Ideias visionárias descem por você como relâmpagos. O desafio é ancorar tanta luz sem se perder na ansiedade. Você não veio para ser comum. Veio para lembrar o futuro.",22:"Você sonha em escala de civilização. O 22 une o sonho do 11 com a disciplina do 4 — é o Mestre Construtor. Seu nome carrega a responsabilidade de erguer algo que sirva a muitos, que dure além de você. Você tem visão, método e resistência espiritual. O medo de falhar pode te paralisar, mas quando age, você materializa legados. Você veio para construir o novo mundo.",33:"Você é amor em serviço da evolução. O 33, raríssimo, é o Mestre Ensinante — vibração do amor incondicional, compaixão crística e cura através do exemplo. Seu nome carrega a missão de elevar através da presença, do ensinar vivendo. Você sente o peso e a bênção de curar. O aprendizado é não carregar o mundo nas costas, mas amar a ponto de libertar. Você veio para lembrar o amor."};function Rq(e){return e.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase()}function vq(e){return e.toString().split("").reduce((t,n)=>t+parseInt(n),0)}function ea(e){let t=[e],n=e;while(n>9){if([11,22,33].includes(n))break;if(n=vq(n),t.push(n),[11,22,33].includes(n))break}return{final:n,trail:t}}function mq(e){return["A","E","I","O","U"].includes(e)}function Dc(e){let t=Rq(e);if(!t.trim())return null;let n=t.split(""),r=[],l=0;for(let c of n){let q=Aq[c];if(q)l+=q,r.push({char:c,value:q,type:mq(c)?"vowel":"consonant"});else if(/[A-Z]/.test(c))r.push({char:c,value:0,type:"other"})}if(l===0)return null;let u=r.filter((c)=>c.type==="vowel"),o=r.filter((c)=>c.type==="consonant"),a=u.reduce((c,q)=>c+q.value,0),i=o.reduce((c,q)=>c+q.value,0);return{original:e,letters:r,total:l,reduction:ea(l),soul:{letters:u,total:a,reduction:a?ea(a):{final:0,trail:[]}},personality:{letters:o,total:i,reduction:i?ea(i):{final:0,tr
